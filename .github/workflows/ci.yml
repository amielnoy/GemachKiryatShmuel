name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# דחיפה חדשה לאותו ענף מבטלת ריצה שעוד לא הסתיימה
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: בדיקות ובנייה
    runs-on: ubuntu-latest
    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: התקנת Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      - name: בדיקת טיפוסים
        run: npm run typecheck

      - name: הרצת הבדיקות
        run: npm test

      - name: בנייה
        run: npm run build

      # דוח הבדיקות נשמר גם כשהריצה נכשלת — שם נמצא המידע המעניין
      - name: שמירת דוח הבדיקות
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
