name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# דחיפה חדשה לאותו ענף מבטלת ריצה שעוד לא הסתיימה
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: בדיקות ובנייה
    runs-on: ubuntu-latest
    timeout-minutes: 50

    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - name: התקנת Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: התקנת תלויות
        run: npm ci

      - name: בדיקת טיפוסים
        run: npm run typecheck

      - name: הרצת הבדיקות
        run: npm test

      - name: בנייה
        run: npm run build

      # דוח הבדיקות נשמר גם כשהריצה נכשלת — שם נמצא המידע המעניין
      - name: שמירת דוח הבדיקות
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ─────────────────────────────────────────────────────────────
  # פריסה לוורסל. שני התפקידים תלויים ב-verify, ולכן קומיט
  # שהבדיקות שלו נכשלו לא מגיע לאוויר בכלל.
  # ─────────────────────────────────────────────────────────────

  deploy-preview:
    name: תצוגה מקדימה (PR)
    needs: verify
    # פורק חיצוני לא מקבל גישה לסודות, ולכן פריסה ממנו תיכשל — עדיף לדלג
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: ודא שהסוד VERCEL_TOKEN מוגדר
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=חסר VERCEL_TOKEN::צרו טוקן ב-https://vercel.com/account/tokens והוסיפו אותו תחת Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: התקנת Vercel CLI
        run: npm install -g vercel@60

      - name: שליפת הגדרות ומשתני הסביבה
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: בנייה
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: פריסה
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      - name: קישור לתצוגה המקדימה בתוך ה-PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n🚀 תצוגה מקדימה: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({ owner, repo, issue_number }))
              .data.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy-production:
    name: פריסה לייצור
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: ודא שהסוד VERCEL_TOKEN מוגדר
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=חסר VERCEL_TOKEN::צרו טוקן ב-https://vercel.com/account/tokens והוסיפו אותו תחת Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: התקנת Vercel CLI
        run: npm install -g vercel@60

      - name: שליפת הגדרות ומשתני הסביבה
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: בנייה
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: פריסה
        id: deploy
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"

      # TODO(amiel): בדיקת עשן אחרי הפריסה — ראה הסבר בשיחה.
      # מה לעשות אם האתר החדש לא עולה? נכשל בקול רם, או חוזר אחורה אוטומטית?
      - name: בדיקת עשן
        run: echo "טרם מוגדר — ראה TODO"
